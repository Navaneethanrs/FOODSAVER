<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registered NGOs - Food Saver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff7f50, #ff6347);
      min-height: 100vh;
      padding: 30px 15px;
    }
    .container {
      background: #ffffff;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }
    .btn-back {
      background: linear-gradient(90deg, #ff7f50, #ff6347);
      border: none;
      color: #fff;
      padding: 10px 22px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 99, 71, 0.35);
      color: #fff;
    }
    .header-title {
      color: #ff6347;
      font-weight: 700;
    }
    .table thead th {
      background: linear-gradient(90deg, #ff7f50, #ff6347);
      color: white;
      border: none;
      padding: 12px 14px;
      font-weight: 600;
    }
    .table tbody tr:hover {
      background-color: #fff8f5;
    }
  </style>
</head>
<body>
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Home</a>
      <a href="registerngo.html" class="btn btn-outline-danger"><i class="fas fa-plus-circle"></i> Register New NGO</a>
    </div>

    <h2 class="text-center header-title mb-4">
      <i class="fas fa-hand-holding-heart"></i> Registered Partner NGOs
    </h2>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>NGO Name</th>
            <th>Contact Person</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Hours</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="ngoTableBody">
          <tr>
            <td colspan="8" class="text-center py-4 text-muted">
              <i class="fas fa-spinner fa-spin"></i> Loading registered NGOs...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadNGOs() {
      const tbody = document.getElementById('ngoTableBody');
      try {
        const res = await fetch('/api/ngos');
        const json = await res.json();
        const list = json.data || [];

        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No NGOs registered yet.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map((ngo, idx) => `
          <tr>
            <td><strong>${idx + 1}</strong></td>
            <td><strong>${ngo.ngo_name || ''}</strong></td>
            <td>${ngo.contact_person || ''}</td>
            <td><a href="tel:${ngo.phone_number}">${ngo.phone_number || ''}</a></td>
            <td><a href="mailto:${ngo.email}">${ngo.email || ''}</a></td>
            <td>${ngo.address || ''}</td>
            <td><span class="badge bg-light text-dark border">${ngo.operating_hours || 'N/A'}</span></td>
            <td>
              ${ngo.latitude && ngo.longitude
                ? `<a href="https://www.google.com/maps?q=${ngo.latitude},${ngo.longitude}" target="_blank" class="btn btn-sm btn-outline-success"><i class="fas fa-map-marker-alt"></i> Map</a>`
                : '<span class="text-muted">N/A</span>'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle"></i> Failed to load NGOs: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadNGOs);
  </script>
</body>
</html>
