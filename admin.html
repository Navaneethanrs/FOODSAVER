<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Food Saver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
    }
    .navbar {
      background: linear-gradient(90deg, #ff7f50, #ff6347);
    }
    .stat-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-3px);
    }
    .stat-icon {
      font-size: 2.2rem;
      opacity: 0.85;
    }
    .table thead th {
      background: #f1f3f5;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark px-3 mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-utensils"></i> Food Saver Admin</a>
      <div>
        <a href="index.html" class="btn btn-sm btn-outline-light me-2"><i class="fas fa-home"></i> Website</a>
        <a href="view_ngos.html" class="btn btn-sm btn-light"><i class="fas fa-users"></i> View NGOs</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <!-- Stats Row -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card stat-card bg-primary text-white p-3">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1 text-white-50">Total Donations</h6>
              <h2 class="mb-0 fw-bold" id="totalMeals">-</h2>
            </div>
            <i class="fas fa-box-open stat-icon"></i>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card bg-success text-white p-3">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1 text-white-50">Accepted / Saved</h6>
              <h2 class="mb-0 fw-bold" id="totalSaved">-</h2>
            </div>
            <i class="fas fa-check-circle stat-icon"></i>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card bg-warning text-white p-3">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="mb-1 text-white-50">Partner NGOs</h6>
              <h2 class="mb-0 fw-bold" id="totalNgos">-</h2>
            </div>
            <i class="fas fa-hands-helping stat-icon"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Donations Table -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-history text-danger"></i> Recent Food Donations</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadDashboard()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Donor</th>
                <th>Food Item</th>
                <th>Quantity</th>
                <th>Location</th>
                <th>Contact</th>
                <th>Pickup Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="donationsTableBody">
              <tr><td colspan="8" class="text-center py-4 text-muted">Loading donations...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const statsRes = await fetch('/api/stats');
        const stats = await statsRes.json();
        document.getElementById('totalMeals').textContent = stats.meals || 0;
        document.getElementById('totalSaved').textContent = stats.food_saved || 0;
        document.getElementById('totalNgos').textContent = stats.volunteers || 0;

        const donRes = await fetch('/api/donations');
        const donJson = await donRes.json();
        const donations = donJson.data || [];
        const tbody = document.getElementById('donationsTableBody');

        if (donations.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No donations recorded yet.</td></tr>';
          return;
        }

        tbody.innerHTML = donations.map((d, i) => `
          <tr>
            <td><strong>${i + 1}</strong></td>
            <td><strong>${d.donor_name || 'Anonymous'}</strong></td>
            <td>${d.food_type || ''}</td>
            <td>${d.quantity || ''}</td>
            <td>${d.location || ''}</td>
            <td><a href="tel:${d.donor_contact}">${d.donor_contact || ''}</a></td>
            <td>${d.pickup_time || ''}</td>
            <td><span class="badge ${d.status === 'accepted' ? 'bg-success' : 'bg-warning'}">${d.status || 'pending'}</span></td>
          </tr>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
